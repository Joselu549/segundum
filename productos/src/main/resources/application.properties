spring.application.name=productos
server.port=61072
spring.datasource.url=jdbc:mysql://localhost:3306/productos?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.rabbitmq.addresses=amqp://user:password@localhost:5672

spring.rabbitmq.queue="usuarios.eventos"
spring.rabbitmq.exchange="bus"
spring.rabbitmq.binding-key="bus.usuarios.#"