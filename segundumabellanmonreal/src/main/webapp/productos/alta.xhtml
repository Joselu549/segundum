<ui:composition template="/WEB-INF/template/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">
        Alta nuevo producto
    </ui:define>
    <ui:param name="estilo2" value="current" />

    <ui:define name="content">
        <div class="row">
            <div class="col-12">
                <div class="content">
        <h:form id="formProducto">
            <p:growl id="growl" showDetail="true" />
            
            <h:panelGrid columns="2" cellpadding="5"> 
                <p:outputLabel for="titulo" value="Título" />
                <p:inputText id="titulo" value="#{altaProductosWeb.titulo}" 
                    required="true" requiredMessage="El título es obligatorio"
                    maxlength="200" style="width: 300px;" />
                
                <p:outputLabel for="descripcion" value="Descripción" />
                <p:inputTextarea id="descripcion" value="#{altaProductosWeb.descripcion}" 
                    rows="5" cols="50" required="true" 
                    requiredMessage="La descripción es obligatoria"
                    maxlength="2000" />
                
                <p:outputLabel for="precio" value="Precio (€)" />
                <p:inputText id="precio" value="#{altaProductosWeb.precio}" 
                    required="true" requiredMessage="El precio es obligatorio"
                    style="width: 150px;">
                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                </p:inputText>
                
                <p:outputLabel for="estado" value="Estado" />
                <p:selectOneMenu id="estado" value="#{altaProductosWeb.estado}" 
                    required="true" requiredMessage="El estado es obligatorio">
                    <f:selectItem itemLabel="Seleccione un estado" itemValue="#{null}" noSelectionOption="true" />
                    <f:selectItems value="#{altaProductosWeb.estadosDisponibles}" />
                </p:selectOneMenu>
                
                <p:outputLabel for="idCategoria" value="ID Categoría" />
                <p:inputText id="idCategoria" value="#{altaProductosWeb.idCategoria}" 
                    required="true" requiredMessage="El ID de categoría es obligatorio"
                    style="width: 300px;" />
                
                <p:outputLabel for="envioDisponible" value="Envío disponible" />
                <p:selectBooleanCheckbox id="envioDisponible" 
                    value="#{altaProductosWeb.envioDisponible}" />
            </h:panelGrid>
            
            <p:commandButton value="Dar de alta" icon="pi pi-check-circle"
                actionListener="#{altaProductosWeb.altaProducto()}" 
                update="formProducto:growl"  style="margin-top: 10px;" />
        </h:form>
    </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
