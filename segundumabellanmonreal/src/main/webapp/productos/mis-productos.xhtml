<ui:composition template="/WEB-INF/template/template.xhtml"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui"
  xmlns:f="http://xmlns.jcp.org/jsf/core">

  <ui:define name="title">Mis productos</ui:define>
  <ui:param name="estilo3" value="current" />

  <ui:define name="content">
    <div class="row">
      <div class="col-12">
        <section class="content">
          <h2>Mis productos publicados</h2>
          <p>Consulta los productos que has dado de alta.</p>

          <p:growl id="growl" showDetail="true" />

          <p:dataTable id="tablaProductos" value="#{misProductosWeb.productos}" var="p" emptyMessage="No tienes productos publicados">
            <p:column headerText="Título">
              <h:outputText value="#{p.titulo}" />
            </p:column>
            <p:column headerText="Precio (€)">
              <h:outputText value="#{p.precio}" />
            </p:column>
            <p:column headerText="Descripción">
              <h:outputText value="#{p.descripcion}" />
            </p:column>
            <p:column headerText="Acciones" style="width:220px;">
              <p:button value="Ver" icon="pi pi-search" outcome="detail" includeViewParams="true" style="margin-right: 5px;">
                <f:param name="id" value="#{p.id}" />
              </p:button>
              <p:button value="Editar" icon="pi pi-pencil" outcome="editar" includeViewParams="true">
                <f:param name="id" value="#{p.id}" />
              </p:button>
            </p:column>
          </p:dataTable>
        </section>
      </div>
    </div>
  </ui:define>
</ui:composition>
