<ui:composition template="/WEB-INF/template/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">Detalle del producto</ui:define>
    <ui:param name="estilo4" value="current" />

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="id" value="#{productoDetailWeb.idProducto}" />
            <f:viewAction action="#{productoDetailWeb.load()}" />
        </f:metadata>
    </ui:define>

    <ui:define name="content">
        <div class="row">
            <div class="col-12">
                <section class="content">
                    <h2>#{productoDetailWeb.producto.titulo}</h2>
                    <p:growl id="growl" showDetail="true">
                        <p:autoUpdate />
                    </p:growl>

                    <p:panel header="Información del producto" style="margin-top: 20px;">
                        <h:panelGrid columns="2" cellpadding="10">
                            <h:outputText value="Descripción:" style="font-weight: bold;" />
                            <h:outputText value="#{productoDetailWeb.producto.descripcion}" />

                            <h:outputText value="Precio:" style="font-weight: bold;" />
                            <h:outputText value="#{productoDetailWeb.producto.precio}">
                                <f:convertNumber type="currency" currencySymbol="€" />
                            </h:outputText>

                            <h:outputText value="Estado:" style="font-weight: bold;" />
                            <h:outputText value="#{productoDetailWeb.producto.estado}" />
                        </h:panelGrid>
                    </p:panel>

                    <div style="margin-top: 20px;">
                        <p:button value="Volver a buscar" icon="pi pi-arrow-left" outcome="buscar" />
                    </div>
                </section>
            </div>
        </div>
    </ui:define>
</ui:composition>
