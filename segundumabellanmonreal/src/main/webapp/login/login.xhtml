<ui:composition template="/WEB-INF/template/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="title">Iniciar sesión</ui:define>
	<ui:param name="estiloLogin" value="current" />

	<ui:define name="content">
		<div class="row">
			<div class="col-6 col-12-medium">
				<section class="content">
					<h2>Accede a tu cuenta</h2>
					<p>Introduce tus credenciales para continuar publicando o gestionando tus productos.</p>

					<h:form id="loginForm">
						<p:growl id="growl" showDetail="true" />

						<p:panelGrid columns="2" columnClasses="label,value" styleClass="formgrid">
							<p:outputLabel for="email" value="Email" />
							<p:inputText id="email" value="#{sesionUsuarioWeb.email}"
								required="true" requiredMessage="El email es obligatorio" maxlength="120" />

							<p:outputLabel for="password" value="Contraseña" />
							<p:password id="password" value="#{sesionUsuarioWeb.password}" feedback="false"
								required="true" requiredMessage="La contraseña es obligatoria" />
						</p:panelGrid>

						<p:commandButton value="Entrar" icon="pi pi-sign-in"
							action="#{sesionUsuarioWeb.login}" update="loginForm:growl"
							style="margin-top: 10px;" />
					</h:form>
				</section>
			</div>

			<div class="col-6 col-12-medium">
				<section class="content">
					<h2>Crear cuenta</h2>
					<p>Regístrate para publicar y gestionar tus productos.</p>

					<h:form id="registroForm">
						<p:growl id="growlRegistro" showDetail="true" />

						<p:panelGrid columns="2" columnClasses="label,value" styleClass="formgrid">
							<p:outputLabel for="regEmail" value="Email" />
							<p:inputText id="regEmail" value="#{registroUsuarioWeb.email}"
								required="true" requiredMessage="El email es obligatorio" maxlength="120" />

							<p:outputLabel for="regNombre" value="Nombre" />
							<p:inputText id="regNombre" value="#{registroUsuarioWeb.nombre}"
								required="true" requiredMessage="El nombre es obligatorio" maxlength="50" />

							<p:outputLabel for="regApellidos" value="Apellidos" />
							<p:inputText id="regApellidos" value="#{registroUsuarioWeb.apellidos}"
								required="true" requiredMessage="Los apellidos son obligatorios" maxlength="100" />

							<p:outputLabel for="regTelefono" value="Teléfono" />
							<p:inputText id="regTelefono" value="#{registroUsuarioWeb.telefono}"
								required="true" requiredMessage="El teléfono es obligatorio" maxlength="20" />

							<p:outputLabel for="regFecha" value="Fecha de nacimiento" />
							<p:calendar id="regFecha" value="#{registroUsuarioWeb.fechaNacimiento}"
								pattern="dd/MM/yyyy" required="true"
								requiredMessage="La fecha de nacimiento es obligatoria" />

							<p:outputLabel for="regPassword" value="Contraseña" />
							<p:password id="regPassword" value="#{registroUsuarioWeb.password}" feedback="true"
								required="true" requiredMessage="La contraseña es obligatoria" />

							<p:outputLabel for="regConfirm" value="Confirmar contraseña" />
							<p:password id="regConfirm" value="#{registroUsuarioWeb.confirmarPassword}" feedback="false"
								required="true" requiredMessage="Debe confirmar la contraseña" />
						</p:panelGrid>

						<p:commandButton value="Registrarse" icon="pi pi-user-plus"
							action="#{registroUsuarioWeb.registrar}" update="registroForm:growlRegistro"
							style="margin-top: 10px;" />
					</h:form>
				</section>
			</div>
		</div>
	</ui:define>
</ui:composition>
